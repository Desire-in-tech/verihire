# Frontend is deployed on Vercel, not as a Render service.
# midnight_service/ is preserved in this repository and is intentionally
# absent here. Do not apply a blueprint that deploys Midnight or points it
# at retired Preprod hosts. Leave MIDNIGHT_SERVICE_URL empty until a later,
# separately approved Preprod deployment.
# Free web services share 750 instance hours per workspace each month and
# spin down after 15 minutes. Do not add a paid plan, a persistent disk, or
# a third web service from this file.

services:
  - type: web
    name: verihire-api
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn Backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_SERVICE_TIMEOUT
        value: "60"
      - key: EMPLOYER_BOOTSTRAP_EMAIL
        sync: false
      - key: EMPLOYER_BOOTSTRAP_PASSWORD
        sync: false
      - key: EMPLOYER_BOOTSTRAP_NAME
        sync: false
      - key: MIDNIGHT_SERVICE_URL
        sync: false
      - key: ENABLE_API_DOCS
        sync: false

  - type: web
    name: verihire-ai
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r ai_service/requirements.txt
    startCommand: uvicorn ai_service.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
