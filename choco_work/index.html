<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a0f" />
  <meta name="description" content="VeriHire — privacy-first hiring verification." />
  <title>VeriHire — Verify more. Reveal less.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="logo.css" />
  <link rel="stylesheet" href="polish.css" />
  <link rel="stylesheet" href="calm.css" />
  <link rel="stylesheet" href="clean.css" />
  <link rel="stylesheet" href="audit-fixes.css" />
</head>
<body>
  <div id="app">
    <main style="min-height:100vh;display:grid;place-items:center;padding:40px;color:#f8fafc;font-family:Arial,sans-serif">
      <div style="text-align:center"><h1 style="margin:0 0 8px">Loading VeriHire…</h1><p style="color:#94a3b8">The application is starting.</p></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    window.addEventListener('error', function (event) {
      var root = document.getElementById('app');
      if (root) {
        root.innerHTML = '<main style="padding:40px;color:#f8fafc;font-family:Arial,sans-serif"><h1>VeriHire could not start</h1><p style="color:#94a3b8">' + event.message + '</p><p>Please refresh the page.</p></main>';
      }
    });
  </script>
  <script src="app.js?v=10"></script>
</body>
</html>
